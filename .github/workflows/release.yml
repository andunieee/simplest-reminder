name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="simplest-reminder-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --title "Simplest Reminder $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
